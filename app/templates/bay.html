{% extends "base.html" %}
{% block title %}染缸还原台{% endblock %}
{% block content %}
<div
  x-data="vatBay()"
  x-init="init()"
>
  <div class="filters" role="toolbar" aria-label="缸位筛选">
    <div class="chips" aria-label="工坊筛选">
      <button
        type="button"
        class="chip"
        :class="{ on: filterWs === null }"
        @click="setWorkshop(null)"
      >全部缸位</button>
      <template x-for="w in workshops" :key="w.id">
        <button
          type="button"
          class="chip"
          :class="{ on: filterWs === w.id }"
          @click="setWorkshop(w.id)"
          x-text="w.name"
        ></button>
      </template>
    </div>
    <div class="filter-selects">
      <label class="filter-field">
        <span>染种</span>
        <select x-model="filterDye" @change="onFilterChange()">
          <option value="">全部染种</option>
          <template x-for="d in dyeTypes" :key="d">
            <option :value="d" x-text="d"></option>
          </template>
        </select>
      </label>
      <label class="filter-field">
        <span>状态</span>
        <select x-model="filterStatus" @change="onFilterChange()">
          <option value="">全部状态</option>
          {% for s in status_order %}
          <option value="{{ s }}">{{ status_labels[s] }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
  </div>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <div
    id="bay-host"
    @click="onCardClick($event)"
  >
    {% include "_bay_results.html" %}
  </div>

  <div class="panel" x-show="selected()" x-cloak x-transition>
    <template x-if="selected()">
      <div>
        <h2>
          <span x-text="selected().code"></span>
          <span style="font-weight:500;font-size:0.9rem;color:#4a6670;margin-left:0.4rem"
                x-text="selected().workshopName + ' · ' + selected().volumeL + ' L'"></span>
        </h2>
        <p class="hint">当前 <strong x-text="selected().statusLabel"></strong>
          · 最近浸染 <span x-text="selected().lastDippedAt || '—'"></span>
          · 设为可染色须最新批次电位 ≤ -500 mV</p>

        <div class="panel-grid">
          <div>
            <h3 style="font-size:1rem;margin:0 0 0.65rem;color:#1f4d6b">登记浸染</h3>
            <form method="post" :action="'/bay/vats/' + selected().id + '/lots'">
              <input type="hidden" name="workshop" :value="filterWs || ''">
              <input type="hidden" name="dye" :value="filterDye">
              <input type="hidden" name="statusFilter" :value="filterStatus">
              <label>浸染时间
                <input type="datetime-local" name="dippedAt" required :value="nowLocal()">
              </label>
              <label>布料米数
                <input type="number" name="clothMeters" step="0.01" min="0.01" required placeholder="例如 24.5">
              </label>
              <label>氧化还原电位 (mV，可空)
                <input type="number" name="redoxMv" step="0.01" placeholder="例如 -520">
              </label>
              <button type="submit">写入本缸</button>
            </form>
          </div>
          <div>
            <h3 style="font-size:1rem;margin:0 0 0.65rem;color:#1f4d6b">改缸状态</h3>
            <form method="post" :action="'/bay/vats/' + selected().id + '/status'">
              <input type="hidden" name="workshop" :value="filterWs || ''">
              <input type="hidden" name="dye" :value="filterDye">
              <input type="hidden" name="statusFilter" :value="filterStatus">
              <label>目标状态
                <select name="status" required :value="selected().status">
                  <option value="idle">闲置</option>
                  <option value="reducing">还原中</option>
                  <option value="ready">可染色</option>
                </select>
              </label>
              <button type="submit">更新状态</button>
            </form>
            <h3 style="font-size:0.95rem;margin:1.25rem 0 0.4rem;color:#1f4d6b">近几笔浸染</h3>
            <ul class="lot-list">
              <template x-for="l in selected().recentLots" :key="l.id">
                <li>
                  <span x-text="l.dippedAt"></span>
                  <span>
                    <span x-text="l.clothMeters + ' m'"></span>
                    ·
                    <span x-text="l.redoxMv === null ? '无电位' : (l.redoxMv + ' mV')"></span>
                  </span>
                </li>
              </template>
              <li x-show="!selected().recentLots.length" style="border:0;color:#6b7c85">尚无记录</li>
            </ul>
          </div>
        </div>
      </div>
    </template>
  </div>

  <p class="rule-foot">工坊 / 染种 / 状态只作缸位可见筛选；上方对账四项始终按全库实时统计，不受筛选影响。浸染与状态均在缸位展开区内完成，无独立表页。</p>
</div>

<script>
  function vatBay() {
    return {
      workshops: {{ workshops | tojson }},
      dyeTypes: {{ dye_types | tojson }},
      allVats: {{ all_vats | tojson }},
      filterWs: {{ filter_workshop if filter_workshop is not none else 'null' }},
      filterDye: {{ (filter_dye or '') | tojson }},
      filterStatus: {{ (filter_status or '') | tojson }},
      selectedId: {{ selected_vat if selected_vat is not none else 'null' }},
      init() {
        const params = new URLSearchParams(window.location.search);
        // 以 URL 为准回填筛选（前进/后退同样走这里）
        this.filterWs = params.get('workshop') ? parseInt(params.get('workshop'), 10) : null;
        if (isNaN(this.filterWs)) this.filterWs = null;
        this.filterDye = params.get('dye') || '';
        this.filterStatus = params.get('status') || '';
        this.selectedId = params.get('vat') ? parseInt(params.get('vat'), 10) : null;
        if (isNaN(this.selectedId)) this.selectedId = null;
        this.syncSelectedClass();
      },
      setWorkshop(id) {
        this.filterWs = id;
        this.onFilterChange();
      },
      onFilterChange() {
        // 筛选只改可见缸位：选中缸若不在新可见集合内则收起面板
        if (this.selectedId !== null && !this.visibleVats().some(v => v.id === this.selectedId)) {
          this.selectedId = null;
        }
        this.refreshResults(true);
      },
      visibleVats() {
        return this.allVats.filter(v => {
          if (this.filterWs !== null && v.workshopId !== this.filterWs) return false;
          if (this.filterDye !== '' && v.dyeType !== this.filterDye) return false;
          if (this.filterStatus !== '' && v.status !== this.filterStatus) return false;
          return true;
        });
      },
      queryString(withVat) {
        const params = new URLSearchParams();
        if (this.filterWs !== null) params.set('workshop', this.filterWs);
        if (this.filterDye !== '') params.set('dye', this.filterDye);
        if (this.filterStatus !== '') params.set('status', this.filterStatus);
        if (withVat && this.selectedId !== null) params.set('vat', this.selectedId);
        const qs = params.toString();
        return qs ? '?' + qs : '';
      },
      async refreshResults(pushUrl) {
        try {
          const resp = await fetch('/bay/partial' + this.queryString(true), {
            headers: { 'Accept': 'text/html' },
            credentials: 'same-origin',
          });
          if (!resp.ok) return;
          const html = await resp.text();
          document.getElementById('bay-host').innerHTML = html;
          this.syncSelectedClass();
          if (pushUrl) {
            history.replaceState(null, '', window.location.pathname + this.queryString(true));
          }
        } catch (e) {
          // 网络异常时保留上一片段，不做静默口径篡改
        }
      },
      onCardClick(event) {
        const card = event.target.closest && event.target.closest('.vat-card');
        if (!card || !document.getElementById('bay-host').contains(card)) return;
        const id = parseInt(card.dataset.vatId, 10);
        if (isNaN(id)) return;
        this.selectedId = this.selectedId === id ? null : id;
        this.syncSelectedClass();
        history.replaceState(null, '', window.location.pathname + this.queryString(true));
      },
      syncSelectedClass() {
        const host = document.getElementById('bay-host');
        if (!host) return;
        host.querySelectorAll('.vat-card').forEach(card => {
          card.classList.toggle('selected', parseInt(card.dataset.vatId, 10) === this.selectedId);
        });
      },
      selected() {
        return this.allVats.find(v => v.id === this.selectedId) || null;
      },
      nowLocal() {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
      },
    };
  }
</script>
{% endblock %}
